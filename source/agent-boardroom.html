<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Workplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
:root {
  /* Layout: pixel coworking floor (glass boardroom in the middle) on the left, crew under it; mission controls on the right. One column on phones. */
  --ink: #0b101c;
  --panel: #131a2a;
  --raise: #1a2338;
  --line: #28334d;
  --text: #e6eaf3;
  --muted: #8f9ab0;
  --accent: #f4b942;
  --good: #6fdc8c;
  --warn: #ff9b5c;
  --font-display: "Pixelify Sans", "Courier New", monospace;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--ink); color: var(--text); font: 14px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
.app { max-width: 1480px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-areas: "head head" "stage side"; gap: 16px; align-items: start; }
header { grid-area: head; display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand canvas { width: 52px; height: 40px; image-rendering: pixelated; flex: none; }
.brand h1 { margin: 0; font: 700 24px/1 var(--font-display); letter-spacing: .02em; text-wrap: balance; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; max-width: 60ch; }
.controls { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; box-shadow: 0 2px 0 #05080f; }
.seg button { border: 0; border-radius: 0; box-shadow: none; background: var(--raise); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: #2a2414; color: var(--accent); }
button { font: 600 13px/1 var(--font-body); color: var(--text); background: var(--raise); border: 1px solid var(--line); border-radius: 5px; padding: 9px 12px; cursor: pointer; box-shadow: 0 2px 0 #05080f; transition: border-color .15s, background .15s; }
button:hover { border-color: #3c4a6c; background: #1f2a42; }
button:active { transform: translateY(1px); box-shadow: 0 1px 0 #05080f; }
button:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
button.primary { background: var(--accent); border-color: #c28a1f; color: #1d1405; }
button.primary:hover { background: #ffc85a; }
.stage { grid-area: stage; display: grid; gap: 12px; min-width: 0; }
.viewport { background: #05070d; border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
.screen { display: flex; justify-content: center; min-width: 0; }
#world { display: block; width: 100%; height: auto; image-rendering: crisp-edges; image-rendering: pixelated; border-radius: 3px; cursor: grab; background: #000; touch-action: pan-y; }
#world.dragging { cursor: grabbing; }
#world:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.cam { position: relative; display: inline-block; max-width: 100%; line-height: 0; }
.nav { position: absolute; top: 50%; transform: translateY(-50%); width: 36px; height: 52px; padding: 0; font: 700 26px/1 var(--font-display); background: rgba(8, 11, 22, .72); border-color: rgba(255, 255, 255, .14); box-shadow: none; }
.nav:active { transform: translateY(-50%); }
.nav.prev { left: 6px; }
.nav.next { right: 6px; }
.nav:disabled { opacity: 0; pointer-events: none; }
.roombar { display: flex; gap: 6px; align-items: stretch; min-width: 0; }
.rooms { position: relative; flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scroll-behavior: smooth; scrollbar-width: thin; padding-bottom: 2px; }
.rooms .room { flex: 0 0 auto; min-width: 104px; }
.room { display: grid; gap: 6px; text-align: left; padding: 8px 10px; font-weight: 500; box-shadow: none; }
.room .rn { font: 500 14px/1 var(--font-display); }
.room .dots { display: flex; gap: 3px; min-height: 6px; flex-wrap: wrap; }
.room .dots i { width: 6px; height: 6px; background: var(--c); }
.room[data-inview="true"] { border-color: #6b5422; background: #1f1c18; }
.room[aria-current="true"] { border-color: var(--accent); background: #2a2414; color: var(--accent); }
.zoom button { min-width: 34px; padding: 9px 0; }
.ticker { display: flex; align-items: center; gap: 12px; font: 500 12px var(--font-mono); color: var(--muted); flex-wrap: wrap; }
.phase { color: var(--text); font: 500 15px/1.2 var(--font-display); letter-spacing: .03em; }
.beat { display: inline-flex; gap: 4px; }
.beat i { width: 8px; height: 8px; background: var(--line); display: block; }
.beat i.on { background: var(--accent); }
.bar { flex: 1 1 120px; height: 8px; background: var(--raise); border: 1px solid var(--line); min-width: 80px; }
.bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.clock { font-variant-numeric: tabular-nums; }
.crew { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.crew-card { width: 100%; height: 100%; text-align: left; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: start; padding: 8px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); box-shadow: none; font-weight: 400; line-height: 1.3; }
.crew-card[aria-pressed="true"] { border-color: var(--role); box-shadow: inset 0 0 0 1px var(--role); color: var(--text); background: var(--raise); }
.crew-card canvas { width: 26px; height: 40px; image-rendering: pixelated; }
.crew-card .nm { display: block; font: 700 15px/1.1 var(--font-display); }
.crew-card .rl { display: block; color: var(--role); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-top: 1px; }
.crew-card .st { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); font-size: 12px; margin-top: 4px; min-height: 2.6em; }
.crew-card .ct { display: block; font: 500 11px var(--font-mono); color: var(--muted); margin-top: 2px; }
.hint { margin: 0; color: var(--muted); font-size: 12px; }
.side { grid-area: side; display: grid; gap: 12px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.panel h2 { margin: 0; font: 700 16px/1.2 var(--font-display); letter-spacing: .03em; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.muted { color: var(--muted); font-size: 12px; margin: 0; }
.muted.err { color: var(--warn); }
.mission-title { margin: 0; font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
form { display: flex; gap: 8px; }
input[type="text"] { flex: 1; min-width: 0; font: 14px var(--font-body); color: var(--text); background: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 9px 10px; }
input[type="text"][aria-invalid="true"] { border-color: var(--warn); }
input::placeholder { color: #66718a; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font-size: 12px; padding: 7px 9px; font-weight: 500; }
.toggle { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; cursor: pointer; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.task { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px 8px 0; overflow: hidden; }
.task .stripe { align-self: stretch; background: linear-gradient(var(--role) 0 50%, var(--role2, var(--role)) 50% 100%); margin: -8px 0; }
.task .tt { font-weight: 600; font-size: 13px; }
.task .tm { color: var(--muted); font-size: 12px; }
.task[data-s="done"] .tt { color: var(--muted); }
.chip { font: 600 11px/1 var(--font-body); padding: 5px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip[data-s="ready"] { color: var(--accent); border-color: #6b5422; }
.chip[data-s="starting"], .chip[data-s="working"] { color: #0c111d; background: var(--role); border-color: transparent; }
.chip[data-s="handoff"] { color: var(--accent); border-color: var(--accent); }
.chip[data-s="done"] { color: var(--good); border-color: #2c5a3a; }
.chip[data-s="changes"] { color: var(--warn); border-color: #6a3d22; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; max-height: 300px; overflow-y: auto; font: 12px/1.4 var(--font-mono); }
.log li { display: grid; grid-template-columns: 52px 8px minmax(0, 1fr); gap: 8px; align-items: baseline; color: #c3cad8; }
.log time { color: var(--muted); font-variant-numeric: tabular-nums; }
.log .dot { width: 8px; height: 8px; background: var(--role, var(--muted)); align-self: center; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
@media (max-width: 1180px) { .crew { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "stage" "side"; }
  .controls { margin-left: 0; }
}
@media (max-width: 520px) {
  .roombar { flex-wrap: wrap; }
  .rooms { flex: 1 0 100%; }
  #btnCam { flex: 1 1 auto; }
  .rooms .room { min-width: 92px; }
  .nav { width: 24px; height: 40px; font-size: 20px; }
  .nav.prev { left: 2px; }
  .nav.next { right: 2px; }
  .room { padding: 7px 6px; }
  .room .rn { font-size: 12px; }
  .app { padding: 12px; gap: 12px; }
  .viewport { padding: 8px; }
  .crew { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .brand h1 { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <canvas id="logo" width="26" height="20" aria-hidden="true"></canvas>
      <h1>Digital Workplace</h1>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="World">
        <button type="button" data-world="night" aria-pressed="false">Night</button>
        <button type="button" data-world="sunset" aria-pressed="false">Sunset</button>
        <button type="button" data-world="day" aria-pressed="false">Day</button>
      </div>
      <button id="btnPause" type="button" aria-pressed="false">Pause</button>
      <button id="btnSpeed" type="button">Speed 1×</button>
      <button id="btnDance" type="button">Dance break</button>
      <button id="btnSound" type="button" aria-pressed="false">Sound off</button>
    </div>
  </header>

  <main class="stage">
    <div class="viewport">
      <div class="screen" id="screenWrap">
        <div class="cam">
          <canvas id="world" width="240" height="176" tabindex="0" role="img" aria-label="Pixel-art office floor with nine rooms along one corridor: reception with a receptionist, a town hall with a stage and an audience, lead office, boardroom, studio, open office, IT lab, kitchen and lounge. Six alien agents walk the corridor between rooms, pair up on shared work, dance a duet when they hand work over, and demo finished work at the town hall. Use the left and right arrow keys to change rooms."></canvas>
          <button class="nav prev" id="btnPrev" type="button" aria-label="Previous room">&#8249;</button>
          <button class="nav next" id="btnNext" type="button" aria-label="Next room">&#8250;</button>
        </div>
      </div>
      <div class="roombar">
        <div class="rooms" id="roomStrip" role="group" aria-label="Rooms"></div>
        <div class="seg zoom" role="group" aria-label="Rooms in view">
          <button type="button" data-zoom="1" aria-pressed="false" aria-label="Show 1 room">1</button>
          <button type="button" data-zoom="2" aria-pressed="false" aria-label="Show 2 rooms">2</button>
          <button type="button" data-zoom="3" aria-pressed="false" aria-label="Show 3 rooms">3</button>
        </div>
        <button id="btnCam" type="button" aria-pressed="true">Auto camera</button>
      </div>
      <div class="ticker">
        <span class="phase" id="phaseLabel">Briefing</span>
        <span class="beat" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <div class="bar" id="progress" role="progressbar" aria-label="Subtasks done" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progressFill"></span></div>
        <span class="clock" id="duetCount">Duets 0</span>
        <span class="clock" id="missionClock">T+00:00</span>
      </div>
    </div>
    <ul class="crew" id="crewList" aria-label="Crew"></ul>
    <p class="hint">Swipe between rooms. Tap an agent to follow it.</p>
  </main>

  <aside class="side">
    <section class="panel" aria-labelledby="hNew">
      <h2 id="hNew">New task</h2>
      <form id="taskForm" autocomplete="off" novalidate>
        <label class="sr-only" for="taskInput">Task for the crew</label>
        <input type="text" id="taskInput" maxlength="80" placeholder="e.g. Reconcile month-end inventory">
        <button class="primary" type="submit">Run task</button>
      </form>
      <p class="muted" id="formHint">Keywords pick the plan: deck, page, report, research.</p>
      <div class="chips" id="presetChips" role="group" aria-label="Sample tasks"></div>
      <label class="toggle" for="autopilot"><input type="checkbox" id="autopilot" checked> Autoplay samples</label>
    </section>
    <section class="panel" aria-labelledby="hBoard">
      <div class="panel-head"><h2 id="hBoard">Mission board</h2><span class="muted" id="planName"></span></div>
      <p class="mission-title" id="missionName"></p>
      <p class="muted" id="duetLine"></p>
      <ol class="tasks" id="taskList"></ol>
    </section>
    <section class="panel" aria-labelledby="hLog">
      <h2 id="hLog">Activity</h2>
      <ol class="log" id="log"></ol>
    </section>
  </aside>
</div>
<div class="sr-only" aria-live="polite" id="live"></div>

<script>
(() => {
'use strict';

// ================= constants =================
const RW = 240, ROOMS = 9, W = RW * ROOMS, H = 176, VW = RW, VH = H, WALL_H = 40, FLOOR_Y = 146, BPM = 112, BEAT = 60 / BPM, SPEED = 80, CELL = 8, GC = W / CELL, GR = H / CELL;
const AUTOPILOT_WAIT = 6;
const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const OUT = '#141826', EYE = '#141826', MOUTH = '#2a1a2e';
const CODE_COLS = ['#78d98e', '#f27fb2', '#5ec8e5', '#f4b942'];
const BOOKS = ['#b84a4a', '#3f7fbf', '#d9a441', '#5a9e6f', '#8a5ab8', '#c9c2b0', '#2f4f6f'];
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

// ================= helpers =================
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = Math.random;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
const mirror = s => s.split('').reverse().join('');
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }
function rect(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function strokeRect(g, x, y, w, h, c) { rect(g, x, y, w, 1, c); rect(g, x, y + h - 1, w, 1, c); rect(g, x, y, 1, h, c); rect(g, x + w - 1, y, 1, h, c); }
function disc(g, cx, cy, r, c) { g.fillStyle = c; for (let dy = -r; dy <= r; dy++) { const h = Math.floor(Math.sqrt(r * r - dy * dy) + 0.3); g.fillRect(cx - h, cy + dy, h * 2 + 1, 1); } }
function line(g, x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy; g.fillStyle = c;
  for (;;) { g.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } }
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ================= 3x5 pixel font =================
const FONT = {
  A: [2, 5, 7, 5, 5], B: [6, 5, 6, 5, 6], C: [3, 4, 4, 4, 3], D: [6, 5, 5, 5, 6], E: [7, 4, 6, 4, 7], F: [7, 4, 6, 4, 4], G: [3, 4, 5, 5, 3], H: [5, 5, 7, 5, 5], I: [7, 2, 2, 2, 7], J: [1, 1, 1, 5, 2], K: [5, 5, 6, 5, 5], L: [4, 4, 4, 4, 7], M: [5, 7, 7, 5, 5],
  N: [6, 5, 5, 5, 5], O: [2, 5, 5, 5, 2], P: [6, 5, 6, 4, 4], Q: [2, 5, 5, 6, 3], R: [6, 5, 6, 5, 5], S: [3, 4, 2, 1, 6], T: [7, 2, 2, 2, 2], U: [5, 5, 5, 5, 7], V: [5, 5, 5, 5, 2], W: [5, 5, 7, 7, 5], X: [5, 5, 2, 5, 5], Y: [5, 5, 2, 2, 2], Z: [7, 1, 2, 4, 7],
  0: [7, 5, 5, 5, 7], 1: [2, 6, 2, 2, 7], 2: [6, 1, 2, 4, 7], 3: [6, 1, 2, 1, 6], 4: [5, 5, 7, 1, 1], 5: [7, 4, 6, 1, 6], 6: [3, 4, 6, 5, 2], 7: [7, 1, 2, 2, 2], 8: [2, 5, 2, 5, 2], 9: [2, 5, 3, 1, 6],
  ' ': [0, 0, 0, 0, 0], '.': [0, 0, 0, 0, 2], ',': [0, 0, 0, 2, 4], ':': [0, 2, 0, 2, 0], '-': [0, 0, 7, 0, 0], '+': [0, 2, 7, 2, 0], '/': [1, 1, 2, 4, 4], '!': [2, 2, 2, 0, 2], '?': [6, 1, 2, 0, 2],
  '%': [5, 1, 2, 4, 5], '&': [2, 5, 2, 5, 3], "'": [2, 2, 0, 0, 0], '#': [5, 7, 5, 7, 5], '(': [1, 2, 2, 2, 1], ')': [4, 2, 2, 2, 4], '$': [3, 6, 2, 3, 6], '"': [5, 5, 0, 0, 0], '@': [2, 5, 7, 4, 3]
};
function drawText(g, str, x, y, color, s = 1) {
  g.fillStyle = color; str = String(str).toUpperCase();
  for (let i = 0; i < str.length; i++) {
    const gl = FONT[str[i]] || FONT[' '];
    for (let r = 0; r < 5; r++) { const b = gl[r]; for (let c = 0; c < 3; c++) if (b & (4 >> c)) g.fillRect(x + (i * 4 + c) * s, y + r * s, s, s); }
  }
}
const textW = (s, k = 1) => (s.length * 4 - 1) * k;
const fitText = (s, n) => { s = String(s).toUpperCase(); return s.length > n ? s.slice(0, n - 1) + '.' : s; };

// ================= 7x7 icons =================
const ICONS = {
  search: ['.###...', '#...#..', '#...#..', '#...#..', '.###...', '....##.', '.....##'],
  code:   ['.......', '#......', '.#.....', '..#....', '.#.....', '#..###.', '.......'],
  brush:  ['.....##', '....###', '...###.', '..###..', '.###...', '##.....', '#......'],
  eye:    ['.......', '..###..', '.#...#.', '#..#..#', '.#...#.', '..###..', '.......'],
  bug:    ['..#.#..', '...#...', '.#####.', '#.###.#', '.#####.', '#.###.#', '..#.#..'],
  star:   ['...#...', '...#...', '#######', '.#####.', '..###..', '.##.##.', '#.....#'],
  check:  ['.......', '......#', '.....#.', '#...#..', '.#.#...', '..#....', '.......'],
  heart:  ['.......', '.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'],
  note:   ['..#####', '..#...#', '..#...#', '..#...#', '###.###', '###.###', '.......'],
  coffee: ['.#.#...', '#.#....', '.......', '#####..', '#####.#', '#####..', '.###...'],
  phone:  ['.......', '.#####.', '##...##', '#.###.#', '..###..', '.#####.', '.#####.'],
  question: ['..###..', '.#...#.', '.....#.', '....#..', '...#...', '.......', '...#...']

const blocked = new Uint8Array(GC * GR);
for (let r = 0; r < GR; r++) for (let c = 0; c < GC; c++) {
  const x0 = c * CELL, y0 = r * CELL;
  blocked[r * GC + c] = BLOCKS.some(([x, y, w, h]) => x < x0 + CELL && x + w > x0 && y < y0 + CELL && y + h > y0) ? 1 : 0;
}
const cellIdx = (x, y) => clamp(Math.floor(y / CELL), 0, GR - 1) * GC + clamp(Math.floor(x / CELL), 0, GC - 1);
function nearestFree(i) {
  if (!blocked[i]) return i;
  const seen = new Uint8Array(GC * GR), q = [i]; seen[i] = 1;
  while (q.length) {
    const cur = q.shift(); if (!blocked[cur]) return cur;
    const r = (cur / GC) | 0, c = cur % GC;
    for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nr = r + dr, nc = c + dc; if (nr < 0 || nc < 0 || nr >= GR || nc >= GC) continue; const ni = nr * GC + nc; if (!seen[ni]) { seen[ni] = 1; q.push(ni); } }
  }
  return i;
}
function astar(s, t) {
  const N = GC * GR, g = new Float32Array(N).fill(Infinity), came = new Int32Array(N).fill(-1), closed = new Uint8Array(N);
  const tr = (t / GC) | 0, tc = t % GC;
  const h = i => { const dr = Math.abs(((i / GC) | 0) - tr), dc = Math.abs((i % GC) - tc); return Math.max(dr, dc) + 0.414 * Math.min(dr, dc); };
  const heap = [];
  const push = (f, i) => { heap.push([f, i]); let k = heap.length - 1; while (k > 0) { const p = (k - 1) >> 1; if (heap[p][0] <= heap[k][0]) break; [heap[p], heap[k]] = [heap[k], heap[p]]; k = p; } };
  const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let k = 0; for (;;) { const l = 2 * k + 1, r = l + 1; let m = k; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === k) break; [heap[m], heap[k]] = [heap[k], heap[m]]; k = m; } } return top[1]; };
  g[s] = 0; push(h(s), s);
  while (heap.length) {
    const cur = pop();
    if (closed[cur]) continue;
    if (cur === t) { const out = [cur]; let p = came[cur]; while (p >= 0) { out.push(p); p = came[p]; } return out.reverse(); }
    closed[cur] = 1;
    const cr = (cur / GC) | 0, cc = cur % GC;
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nr = cr + dr, nc = cc + dc; if (nr < 0 || nc < 0 || nr >= GR || nc >= GC) continue;
      const ni = nr * GC + nc; if (blocked[ni] || closed[ni]) continue;
      if (dr && dc && (blocked[cr * GC + nc] || blocked[nr * GC + cc])) continue;
      const ng = g[cur] + (dr && dc ? 1.414 : 1);
      if (ng < g[ni]) { g[ni] = ng; came[ni] = cur; push(ng + h(ni), ni); }
    }
  }
  return null;
}
function clearLine(p, q) {
  const d = Math.hypot(q.x - p.x, q.y - p.y), n = Math.ceil(d / 3);
  for (let i = 1; i < n; i++) if (blocked[cellIdx(p.x + (q.x - p.x) * i / n, p.y + (q.y - p.y) * i / n)]) return false;
  return true;
}
function findPath(x, y, tx, ty) {
  const cells = astar(nearestFree(cellIdx(x, y)), nearestFree(cellIdx(tx, ty)));
  const pts = cells ? cells.map(i => ({ x: (i % GC) * CELL + 4, y: ((i / GC) | 0) * CELL + 4 })) : [];
  const full = [{ x, y }, ...pts, { x: tx, y: ty }], out = [];
  let k = 0;
  while (k < full.length - 1) { let j = Math.min(full.length - 1, k + 40); while (j > k + 1 && !clearLine(full[k], full[j])) j--; out.push(full[j]); k = j; }
  return out;
}

function buildLights() {

  const id = g.getImageData(0, 0, W, H), d = id.data, L = 11;
  for (let i = 0, n = W * H; i < n; i++) {

function paintEyes(g, ox, oy, type, face, blink) {
  if (face === 'up') return;
  const E = EYES[type] || EYES.two, s = E.size;
  let pts = face === 'down' ? E.down : E.right;
  if (face === 'left') pts = pts.map(([x, y]) => [11 - x - s, y]);
  for (const [ex, ey] of pts) {
    const X = ox + ex, Y = oy + ey;
    if (s === 1) { rect(g, X, blink ? Y + 1 : Y, 1, blink ? 1 : 2, EYE); continue; }
    if (blink) { rect(g, X, Y + s - 1, s, 1, EYE); continue; }
    rect(g, X, Y, s, s, EYE); rect(g, X, Y, 1, 1, '#ffffff');
  }
}
function paintSprite(g, ox, oyL, bob, face, arms, legs, look, blink, flash) {
  const role = look.rk || ROLES[look.role], oy = oyL + bob, map = SPR[face] || SPR.down;
  // three tentacle feet
  const legTop = oy + 14, legBot = oyL + 15;
  for (const [c, lifted] of [[3, legs === 1], [5, legs === 2], [7, legs === 1]]) {
    const yb = lifted ? legBot - 1 : legBot;
    for (let y = legTop; y <= yb; y++) rect(g, ox + c, y, 1, 1, y === yb ? OUT : role.dark);
  }
  const pal = { o: OUT, b: role.color, B: role.dark, l: flash ? role.glow : role.light, k: role.blush, m: MOUTH };
  for (let r = 2; r < 14; r++) {
    const row = map[r];
    for (let c = 0; c < 11; c++) { const ch = row[c]; if (ch === '.') continue; g.fillStyle = pal[ch]; g.fillRect(ox + c, oy + r, 1, 1); }
  }
  if (look.spots) for (const [sx, sy] of look.spots) rect(g, ox + (face === 'left' ? 10 - sx : sx), oy + sy, 1, 1, role.light);
  if (look.ant) for (const [c, tx] of [[3, 2], [7, 8]]) { rect(g, ox + c, oy, 1, 2, role.dark); rect(g, ox + tx, oy - 1, 1, 1, flash ? '#ffffff' : role.light); }
  paintEyes(g, ox, oy, look.eyes, face, blink);
  const acc = look.rk ? look.accObj : ACCS[role.acc];
  let am = acc && (acc[face] || acc.all);
  if (acc && !am && face === 'left' && acc.right) am = acc.right.map(mirror);
  if (am) for (let r = 0; r < am.length; r++) { const row = am[r]; for (let c = 0; c < 11; c++) { const ch = row[c]; if (ch === '.') continue; g.fillStyle = acc.cols[ch]; g.fillRect(ox + c, oy + acc.y0 + r, 1, 1); } }
  // stubby arms
  const armUp = x => { rect(g, x, oy + 5, 1, 4, role.color); rect(g, x, oy + 4, 1, 1, role.light); };
  const armDown = (x, y) => { rect(g, x, y, 1, 2, role.color); rect(g, x, y + 2, 1, 1, role.dark); };
  switch (arms) {
    case 'up': armUp(ox); armUp(ox + 10); break;
    case 'left': armUp(ox); armDown(ox + 10, oy + 8); break;
    case 'right': armDown(ox, oy + 8); armUp(ox + 10); break;
    case 'type': { const t = Math.floor(visT * 8) % 2; armDown(ox, oy + 7 + t); armDown(ox + 10, oy + 8 - t); break; }
    default: armDown(ox, oy + 8); armDown(ox + 10, oy + 8);
